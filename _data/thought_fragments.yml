- id: fragment-007
  title: 人机协作的关键是让信息传递尽可能不失真
  summary: |-
    人机协作的关键，是让人与 AI 在持续交互过程中的双向信息传递尽可能不失真。
    一方面，人需要尽可能完整、准确地将真实意图传递给 AI；另一方面，AI 也需要将推理、搜索和计算得到的信息，以人能够充分理解、判断和继续反馈的方式传递回来。
    任何一个环节出现表达缺失、歧义、过度压缩或理解偏差，都会造成信息损失，并在后续交互中不断累积。
    因此，人机协作系统真正需要优化的，不是某一次 Prompt，而是整个 **Human ↔ AI** 循环中的信息保真度（Information Fidelity），让每一轮交互都尽可能保留上一轮真正重要的信息。
  tags:
    - 人机协作
    - 意图表达
  status: working
  created_at: 2026-09-18

- id: fragment-006
  title: 如今大模型真正值得优化的是结构而不是参数堆积
  summary: 在当前阶段，单纯继续堆积参数已经越来越难带来真正的突破，反而会迅速放大训练与推理成本；相比之下，结构层面的优化往往更关键，也更能避免资源被低效浪费。结构与任务的相关性更强，往往可以使用更少的参数达到更好的效果。
  tags:
    - 模型
    - 优化
  status: working
  created_at: 2026-04-02

- id: fragment-005
  title: 模型被视作黑匣子的根本原因在于人类尚未真正掌握任务规律
  summary: 模型之所以呈现出黑匣子特征，很多时候不只是因为模型本身复杂，更因为人类尚未真正理解任务背后的规律，以及这些规律如何映射为数学表达；而模型训练的根本，正是去学习并模拟这种规律，并通过数学公式表达出来。这与Weierstrass逼近定理有着很明显的相似性：只要规律存在，理论上模型是可以通过足够的参数和训练来逼近的，但前提是我们需要先理解这些规律是什么，以及它们如何作用于输入输出之间的关系。
  tags:
    - 模型
    - 认知
  status: working
  created_at: 2026-04-02

