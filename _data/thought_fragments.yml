- id: fragment-009
  title: 模型行为的来源是模型结构与数据分布
  summary: |-
    模型产生任何行为的原因，归根结底都来自两个方面：模型结构与数据分布。
    模型结构决定信息如何被表示、传递和处理，也影响模型能够学习和表达哪些规律。
    数据分布则提供模型学习的经验：训练数据及其分布影响模型形成的能力、偏好和局限，推理时的输入及上下文则影响这些能力如何在具体情境中表现出来。
    因此，理解某种模型特定行为时，可以同时考察模型的结构特性，以及训练和使用过程中接触到的数据。

    例如，重要提示词有时放在长上下文的开头或结尾，比放在中间更容易生效。这可能与模型结构和训练数据共同有关：
    - 首因效应：在 Decoder-only 架构的因果注意力中，开头的内容可被后续各位置引用，有机会较早影响后续内容的表示。
    - 近因效应：结尾的指令更接近生成位置，一些模型更容易利用附近的信息。
    - 中间内容易被忽略：长上下文中，大量信息共同竞争模型的注意力，中间内容可能得不到充分利用。
    - 位置编码的影响：不同的位置编码方式可能影响模型处理远距离信息的能力，在长序列中产生位置偏差。
    - 训练数据的习惯：人类文本常用总分、分总或总分总等结构，把主旨放在开头或结尾；模型可能从数据中学到类似的位置偏好。
    简言之，模型结构及其位置处理方式，加上人类文本的数据分布，可能共同造成首尾位置更易被利用、中间内容更易被忽略的现象。具体成因和效果因模型及任务而异，不能认为首尾位置一定更好。
  tags:
    - 模型
    - 认知
  status: working
  created_at: 2026-11-04

