- id: fragment-006
  title: 如今大模型真正值得优化的是结构而不是参数堆积
  summary: 在当前阶段，单纯继续堆积参数已经越来越难带来真正的突破，反而会迅速放大训练与推理成本；相比之下，结构层面的优化往往更关键，也更能避免资源被低效浪费。结构与任务的相关性更强，往往可以使用更少的参数达到更好的效果。
  tags:
    - 模型
    - 优化
  status: working
  created_at: 2026-04-02

- id: fragment-007
  title: 人机协作的关键是让意图传递尽可能不失真
  summary: |-
    未来人机协作的关键，不只是让 AI 更聪明，而是让人的意图在传递给 AI 时尽可能不失真。

    假设一个任务的完整意图是 **5**，但人类受限于表达能力，只表达出了 **3**，其中还有 **0.5** 存在歧义，那么 AI 最终真正准确理解的信息可能只有 **2.5**。即使 AI 拥有足够强的能力，它也只能基于这 **2.5** 去完成任务。

    所以，很多时候并不是 **AI 不够聪明，而是 AI 从一开始就没有得到完整、准确的任务信息。**
  tags:
    - 人机协作
    - 意图表达
  status: working
  created_at: 2026-09-18

